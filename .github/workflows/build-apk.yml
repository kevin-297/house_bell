name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"   # matches the version used locally
          channel: "stable"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli flet-audio

      - name: Build APK
        run: |
          flet build apk --android-skip-build-dependency-validation --android-permissions android.permission.INTERNET=true android.permission.ACCESS_WIFI_STATE=true android.permission.ACCESS_NETWORK_STATE=true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: house-bell-apk
          path: build/apk/*.apk
